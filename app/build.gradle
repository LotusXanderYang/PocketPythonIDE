plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.pocketpythonide'
    compileSdk 35

    def preservedDebugKeystore = rootProject.file('.toolchain/android-user/debug.keystore')
    signingConfigs {
        preservedDebug {
            storeFile preservedDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            if (preservedDebugKeystore.isFile()) {
                signingConfig signingConfigs.preservedDebug
            }
        }
    }

    defaultConfig {
        applicationId 'com.example.pocketpythonide'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.1.1-beta.1'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

