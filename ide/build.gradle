plugins { id 'com.android.application' }

android {
    namespace 'com.example.pocketpythonide.ide'
    compileSdk 35
    def preservedDebugKeystore = rootProject.file('.toolchain/android-user/debug.keystore')
    signingConfigs {
        preservedDebug {
            storeFile preservedDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            if (!preservedDebugKeystore.isFile())
                throw new GradleException('缺少沿用的调试签名密钥；为保护已安装 IDE 的数据，拒绝生成签名不兼容的 APK')
            signingConfig signingConfigs.preservedDebug
        }
    }
    defaultConfig {
        applicationId 'com.example.pocketandroidide'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-alpha.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':workbench')
    implementation project(':pack-sdk')
}
