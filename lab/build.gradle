plugins { id 'com.android.application' }

android {
    namespace 'com.example.pocketpythonide.lab'
    compileSdk 35
    def preservedDebugKeystore = rootProject.file('.toolchain/android-user/debug.keystore')
    signingConfigs {
        preservedDebug {
            storeFile preservedDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            if (!preservedDebugKeystore.isFile())
                throw new GradleException('缺少沿用的调试签名密钥；为保护已安装 Lab 的数据，拒绝生成签名不兼容的 APK')
            signingConfig signingConfigs.preservedDebug
        }
    }
    defaultConfig {
        applicationId 'com.example.pocketpythonlab'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.0-alpha.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation project(':workbench') }

def verifyRuntimeAsset = tasks.register('verifyRuntimeAsset') {
    inputs.file('src/main/assets/runtime.json')
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(file('src/main/assets/runtime.json'))
        def runtime = file('src/main/assets/runtime.zip')
        if (!runtime.isFile()) throw new GradleException(
                'Lab runtime.zip is missing; run build-local.ps1 -Product lab to prepare it.')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        runtime.withInputStream { stream ->
            byte[] block = new byte[1024 * 1024]
            int size
            while ((size = stream.read(block)) != -1) digest.update(block, 0, size)
        }
        def actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        if (!actual.equalsIgnoreCase(manifest.asset_sha256.toString()))
            throw new GradleException("Lab runtime.zip SHA-256 mismatch: $actual")
    }
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }
        .configureEach { dependsOn verifyRuntimeAsset }
