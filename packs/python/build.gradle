plugins { id 'com.android.application' }

android {
    namespace 'org.pocketide.python'
    compileSdk 35
    def preservedDebugKeystore = rootProject.file('.toolchain/android-user/debug.keystore')
    signingConfigs {
        preservedDebug {
            storeFile preservedDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            if (!preservedDebugKeystore.isFile())
                throw new GradleException('缺少沿用的调试签名密钥；拒绝生成无法覆盖安装的 Python 语言包')
            signingConfig signingConfigs.preservedDebug
        }
    }
    defaultConfig {
        applicationId 'com.example.pocketpythonstd'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.0-stage8'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { aidl true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation project(':pack-sdk') }

def verifyPythonRuntime = tasks.register('verifyPythonRuntime') {
    inputs.file('src/main/assets/runtime.json')
    inputs.file('pocket_debug_adapter.py')
    inputs.file('src/main/assets/pocket_debug_adapter.py')
    doLast {
        if (!java.util.Arrays.equals(file('pocket_debug_adapter.py').bytes,
                file('src/main/assets/pocket_debug_adapter.py').bytes))
            throw new GradleException('Python DAP adapter source and packaged asset differ')
        def manifest = new groovy.json.JsonSlurper().parse(file('src/main/assets/runtime.json'))
        def archive = file('src/main/assets/runtime.zip')
        if (!archive.isFile()) throw new GradleException(
                'Python base runtime is missing; run python packs/python/prepare_runtime.py')
        if (archive.length() != manifest.asset_bytes.toLong())
            throw new GradleException('Python base runtime size differs from manifest')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { stream ->
            byte[] block = new byte[1024 * 1024]
            int size
            while ((size = stream.read(block)) != -1) digest.update(block, 0, size)
        }
        def actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        if (!actual.equalsIgnoreCase(manifest.asset_sha256.toString()))
            throw new GradleException("Python base runtime SHA-256 mismatch: $actual")
        if (!file('src/main/jniLibs/arm64-v8a/libnativepythonbridge.so').isFile())
            throw new GradleException('Python native bridge is missing')
    }
}
tasks.matching { it.name.startsWith('merge')
        && (it.name.endsWith('Assets') || it.name.endsWith('NativeLibs')) }
        .configureEach { dependsOn verifyPythonRuntime }
