plugins { id 'com.android.application' }

android {
    namespace 'org.pocketide.sample.echo'
    compileSdk 35
    defaultConfig {
        applicationId 'org.pocketide.sample.echo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildFeatures { aidl true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation project(':pack-sdk') }
